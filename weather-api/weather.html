<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>

    <div class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden">

        <!-- Background Video -->
        <video
            autoplay
            muted
            loop
            playsinline
            class="absolute inset-0 w-full h-full object-cover"
        >
            <source src="bg-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Optional Dark Overlay -->
        <div class="absolute inset-0 bg-black/40"></div>

        <!-- Weather Card -->
        <div class="relative z-10 w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8">

            <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-6">
                <i class="ri-sun-cloudy-fill" ></i> Weather App
            </h1>

            <div class="flex flex-col sm:flex-row gap-3">
                <input
                    type="text"
                    id="city"
                    placeholder="Enter city name"
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >

                <button
                  id="searchBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-300"
                >
                    Search
                </button>
            </div>

            <div
                id="weather"
                class="mt-6 hidden rounded-2xl p-5 text-center" style="background-image: url(https://img.freepik.com/free-photo/season-landscape-fluffy-weather-spring_1122-2347.jpg?semt=ais_hybrid&w=740&q=80);"
            ></div>

        </div>

    </div>

    <script src="weather.js"></script>

</body>
</html>
