<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-700 via-blue-700 to-sky-500 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8">

        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-6">
            🌤 Weather App
        </h1>

        <div class="flex flex-col sm:flex-row gap-3">
            <input
                type="text"
                id="city"
                placeholder="Enter city name"
                class="flex-1 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >

            <button
                onclick="getWeather()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-300"
            >
                Search
            </button>
        </div>

        <div
            id="weather"
            class="mt-6 hidden bg-blue-50 rounded-2xl p-5 text-center"
        ></div>

    </div>
<script src="weather.js"></script>
</body>
</html>
